<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Панель судьи | Live</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; color: white; background: #03111f; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #8fdcff; font-weight: 800; }
    .btn-reset { background: #ff4757; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1200px; margin: 0 auto; }
    .judge-panel { display: flex; flex-direction: column; gap: 15px; }
    .athlete-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .athlete-card.done { border-color: #4caf50; background: rgba(76, 175, 80, 0.1); }
    .athlete-card.fall { border-color: #f44336; background: rgba(244, 67, 54, 0.1); }
    .athlete-info h3 { font-size: 18px; margin-bottom: 5px; }
    .athlete-info span { font-size: 12px; color: #8fdcff; }
    .controls { display: flex; gap: 10px; }
    input[type="number"] { width: 90px; padding: 10px; border-radius: 8px; border: none; font-size: 18px; font-weight: 600; text-align: center; }
    button { padding: 10px 15px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; }
    .btn-save { background: #1b8fff; }
    .btn-fall { background: #f44336; }
    .live-protocol { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 20px; }
    .live-protocol h2 { margin-bottom: 20px; text-align: center; }
    .protocol-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; }
    .rank { font-weight: 800; color: #8fdcff; width: 30px; }
    .time { font-weight: 800; font-family: monospace; font-size: 18px; }
    .status-fall { color: #f44336; font-weight: 800; }
</style>
</head>
<body>

<div class="header">
    <h1>СКОРОСТЬ</h1>
    <p>Судейский пульт</p>
</div>

<div class="container">
    <div class="judge-panel" id="judge-panel">Установка соединения...</div>
    <div class="live-protocol">
        <h2>Live-Протокол</h2>
        <div id="protocol-list">Ожидание данных...</div>
    </div>
</div>

<!-- Подключаем Firebase как модуль -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Твои настройки из Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDBM4sSImsocLqYETY491XnA9WqwsN_iko",
        authDomain: "ice-climbing-live.firebaseapp.com",
        databaseURL: "https://ice-climbing-live-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ice-climbing-live",
        storageBucket: "ice-climbing-live.firebasestorage.app",
        messagingSenderId: "1077681693342",
        appId: "1:1077681693342:web:b068d2b90548af0888918f",
        measurementId: "G-LDDYRM9S9J"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const athletesRef = ref(db, 'athletes');

    // Слушатель базы данных в реальном времени
    onValue(athletesRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const athletes = Object.values(data);
        renderJudgePanel(athletes);
        renderProtocol(athletes);
    });

    function renderJudgePanel(athletes) {
        const panel = document.getElementById('judge-panel');
        panel.innerHTML = '';

        athletes.forEach(a => {
            let cardClass = 'athlete-card';
            if (a.status === 'OK') cardClass += ' done';
            if (a.status === 'FALL') cardClass += ' fall';

            panel.innerHTML += `
                <div class="${cardClass}">
                    <div class="athlete-info">
                        <h3>${a.name}</h3>
                        <span>Номер: ${a.number}</span>
                    </div>
                    <div class="controls">
                        <input type="number" id="time-${a.id}" step="0.01" placeholder="0.00" 
                            ${a.status !== 'WAITING' ? 'disabled' : ''} 
                            value="${a.time > 0 ? a.time : ''}">
                        <button class="btn-save" onclick="saveResult(${a.id})" ${a.status !== 'WAITING' ? 'disabled' : ''}>Ввод</button>
                        <button class="btn-fall" onclick="markFall(${a.id})" ${a.status !== 'WAITING' ? 'disabled' : ''}>Срыв</button>
                    </div>
                </div>
            `;
        });
    }

    // Функции сохранения, отправляющие данные на сервер Google
    window.saveResult = function(id) {
        const input = document.getElementById(`time-${id}`);
        const timeVal = parseFloat(input.value);
        if (isNaN(timeVal)) { alert("Введите время!"); return; }
        
        update(ref(db, 'athletes/' + id), { time: timeVal, status: 'OK' });
    }

    window.markFall = function(id) {
        update(ref(db, 'athletes/' + id), { time: 999, status: 'FALL' });
    }

    function renderProtocol(athletes) {
        const list = document.getElementById('protocol-list');
        list.innerHTML = '';
        let finished = athletes.filter(a => a.status !== 'WAITING');

        // Алгоритм сортировки
        finished.sort((a, b) => {
            if (a.status === "FALL" && b.status !== "FALL") return 1;
            if (b.status === "FALL" && a.status !== "FALL") return -1;
            if (a.time === b.time) return Math.random() - 0.5;
            return a.time - b.time;
        });

        finished.forEach((a, index) => {
            let displayTime = a.status === 'FALL' ? '<span class="status-fall">СРЫВ</span>' : `${a.time.toFixed(2)} с`;
            list.innerHTML += `
                <div class="protocol-row">
                    <div><span class="rank">${index + 1}.</span> ${a.name}</div>
                    <div class="time">${displayTime}</div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
