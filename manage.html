<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Управление спортсменами | Ice Climbing Live</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
    .manage-container { max-width: 800px; margin: 140px auto 60px; padding: 0 20px; }
    .manage-header { margin-bottom: 40px; text-align: center; }
    .manage-header h1 { font-size: 36px; font-weight: 800; color: white; margin-bottom: 10px; }
    
    .add-form {
        background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 30px;
        display: flex;
        gap: 15px;
        margin-bottom: 40px;
        backdrop-filter: blur(20px);
    }
    .add-form input {
        flex-grow: 1;
        padding: 15px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(0,0,0,0.2);
        color: white;
        font-size: 16px;
        outline: none;
    }
    .add-form input:focus { border-color: #62d5ff; }
    .btn-add {
        padding: 15px 30px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #62d5ff, #1b8fff);
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 170, 255, 0.3); }

    .athletes-list {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 20px;
        padding: 20px;
    }
    .athlete-item {
        display: flex;
        justify-content: space-between;
        padding: 15px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        align-items: center;
    }
    .athlete-item:last-child { border-bottom: none; }
    .btn-delete { background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<header>
    <div class="logo">ICE CLIMBING LIVE</div>
    <nav>
        <a href="dashboard.html" style="color: #62d5ff;">← В кабинет</a>
    </nav>
</header>

<div class="manage-container">
    <div class="manage-header">
        <h1>Спортсмены</h1>
        <p style="color: #8fdcff;">Добавление участников в стартовый протокол</p>
    </div>

    <!-- Форма добавления -->
    <div class="add-form">
        <input type="text" id="athlete-name" placeholder="Фамилия Имя (например, Иванов Иван)" required>
        <input type="number" id="athlete-number" placeholder="Стартовый №" style="max-width: 150px;" required>
        <button class="btn-add" onclick="addAthlete()">Добавить</button>
    </div>

    <!-- Список уже добавленных -->
    <div class="athletes-list" id="athletes-list">
        <p style="text-align: center; color: #bdd9ea; padding: 20px;">Загрузка списка...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDBM4sSImSOcLqYETY491XnA9WqwsN_iko",
        authDomain: "ice-climbing-live.firebaseapp.com",
        databaseURL: "https://ice-climbing-live-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "ice-climbing-live",
        storageBucket: "ice-climbing-live.firebasestorage.app",
        messagingSenderId: "1077681693342",
        appId: "1:1077681693342:web:b068d2b90548af0888918f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const athletesRef = ref(db, 'athletes');

    // ДОБАВЛЕНИЕ УЧАСТНИКОВ
    window.addAthlete = function() {
        const nameInput = document.getElementById('athlete-name');
        const numInput = document.getElementById('athlete-number');
        
        if (nameInput.value === '' || numInput.value === '') {
            alert("Заполните имя и номер!"); return;
        }

        const uniqueId = Date.now(); // Создаем уникальный ID из текущего времени
        
        set(ref(db, 'athletes/' + uniqueId), {
            id: uniqueId,
            name: nameInput.value,
            number: numInput.value,
            time: 0,
            status: "WAITING"
        }).then(() => {
            nameInput.value = ''; // Очищаем форму
            numInput.value = '';
        });
    }

    // УДАЛЕНИЕ
    window.deleteAthlete = function(id) {
        if(confirm("Точно удалить спортсмена?")) {
            remove(ref(db, 'athletes/' + id));
        }
    }

    // ВЫВОД СПИСКА
    onValue(athletesRef, (snapshot) => {
        const data = snapshot.val();
        const listDiv = document.getElementById('athletes-list');
        
        if (!data) {
            listDiv.innerHTML = '<p style="text-align: center; color: #bdd9ea; padding: 20px;">Список пуст. Добавьте первого спортсмена.</p>';
            return;
        }

        listDiv.innerHTML = '';
        Object.values(data).forEach(a => {
            listDiv.innerHTML += `
                <div class="athlete-item">
                    <div>
                        <strong style="color: white; font-size: 18px;">${a.name}</strong>
                        <span style="color: #8fdcff; margin-left: 15px;">№ ${a.number}</span>
                    </div>
                    <button class="btn-delete" onclick="deleteAthlete(${a.id})">Удалить</button>
                </div>
            `;
        });
    });
</script>

</body>
</html>
